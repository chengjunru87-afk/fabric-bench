test:
  name: credential-benchmark
  workers:
    number: 4
  rounds:
    - label: issueCredential
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload.js
        arguments:
          contractId: credentialcontract
          operation: issueCredential
    - label: verifyCredential
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload.js
        arguments:
          contractId: credentialcontract
          operation: verifyCredential
